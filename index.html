<title>Compteur de coffres</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf7;--text:#2b2118;--muted:#8a7a68;--accent:#d98e1f;--accent-text:#fff;--line:#e6dcc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#241c14;--text:#f3e9d8;--muted:#a09080;--accent:#e8a33a;--accent-text:#1a1208;--line:#3a2f22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120d;--card:#241c14;--text:#f3e9d8;--muted:#a09080;--accent:#e8a33a;--accent-text:#1a1208;--line:#3a2f22;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;max-width:520px;width:100%;margin:0 auto;min-height:0}
.total{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px;text-align:center}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.total .n{font-size:56px;font-weight:800;line-height:1.05}
.game{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px}
.game b{font-size:18px}
.game .c{font-size:18px;font-weight:700;color:var(--accent)}
#tap{flex:1;min-height:180px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;cursor:pointer;transition:transform .08s}
#tap:active{transform:scale(.97)}
#tap .big{font-size:clamp(80px,16vh,120px);font-weight:800;line-height:1}
#tap .sub{font-size:20px;font-weight:700;opacity:.85}
.edit{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
#editbox{display:none;gap:10px}
#editbox.on{display:flex}
#editinput{flex:1;min-width:0;font-size:22px;font-weight:700;font-family:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--accent);background:var(--card);color:var(--text);user-select:text;-webkit-user-select:text}
#editok{background:var(--accent);color:var(--accent-text);border:0;border-radius:14px;padding:0 22px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:14px 6px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn:active{opacity:.6}
.btn:disabled{opacity:.35}
#stats{display:none;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;overflow:auto;flex:1;min-height:0}
body.showstats #stats{display:flex}
body.showstats #tap{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.kpi .v{font-size:28px;font-weight:800}
.list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.item{display:flex;align-items:center;gap:10px;font-size:14px}
.item .g{width:64px;color:var(--muted);flex:none}
.bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.item .v{width:28px;text-align:right;font-weight:700}
.chest{height:clamp(56px,13vh,120px);width:auto;margin-bottom:4px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
</style>
</head>

  <div id="stats">
    <div class="kpis">
      <div class="kpi"><div class="v" id="avg">0</div><div class="label">Moy. / game</div></div>
      <div class="kpi"><div class="v" id="ngames">1</div><div class="label">Games</div></div>
      <div class="kpi"><div class="v" id="best">0</div><div class="label">Meilleure game</div></div>
      <div class="kpi"><div class="v" id="avgdone">–</div><div class="label">Moy. games finies</div></div>

  </div>

  <div class="row">
    <button class="btn" id="undo">↩︎ Annuler</button>
    <button class="btn" id="newgame">➕ Nouvelle game</button>
    <button class="btn" id="statbtn">📊 Stats</button>
  </div>
</div>

<script>
var KEY='compteur-coffres-v1';
var S={games:[0],history:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.games)&&p.games.length&&Array.isArray(p.history))S=p;}}catch(e){}
if(typeof S.offset!=='number')S.offset=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function render(){
  var g=S.games,cur=g[g.length-1],tot=sum(g);
  document.getElementById('total').textContent=tot+S.offset;
  document.getElementById('gname').textContent='Game '+g.length;
  document.getElementById('bigcount').textContent=cur;
  document.getElementById('undo').disabled=S.history.length===0;
  document.getElementById('avg').textContent=fmt(tot/g.length);
  document.getElementById('ngames').textContent=g.length;
  document.getElementById('best').textContent=Math.max.apply(null,g);
  var done=g.slice(0,-1);
  document.getElementById('avgdone').textContent=done.length?fmt(sum(done)/done.length):'–';
  var max=Math.max.apply(null,g.concat([1])),html='';
  for(var i=g.length-1;i>=0;i--){
    html+='<div class="item"><span class="g">Game '+(i+1)+(i===g.length-1?' ●':'')+'</span><span class="bar"><i style="width:'+(g[i]/max*100)+'%"></i></span><span class="v">'+g[i]+'</span></div>';
  }
  document.getElementById('list').innerHTML=html;
}
function act(type){S.history.push(type);if(type==='c')S.games[S.games.length-1]++;else S.games.push(0);save();render();}
document.getElementById('tap').onclick=function(){act('c');};
document.getElementById('newgame').onclick=function(){act('g');};
document.getElementById('undo').onclick=function(){
  var t=S.history.pop();if(!t)return;
  if(typeof t==='object'){if('prevOffset' in t)S.offset=t.prevOffset;else S.games[S.games.length-1]=t.prev;}
  else if(t==='c')S.games[S.games.length-1]=Math.max(0,S.games[S.games.length-1]-1);
  else if(S.games.length>1)S.games.pop();
  save();render();
};
document.getElementById('statbtn').onclick=function(){
  document.body.classList.toggle('showstats');
  this.textContent=document.body.classList.contains('showstats')?'🔙 Compteur':'📊 Stats';
};
var box=document.getElementById('editbox'),inp=document.getElementById('editinput');
document.getElementById('editbtn').onclick=function(){
  box.classList.toggle('on');
  if(box.classList.contains('on')){inp.value=sum(S.games)+S.offset;inp.focus();inp.select();}
};
function applyEdit(){
  var v=parseInt(inp.value,10);
  if(!isNaN(v)){
    v=Math.max(0,Math.min(999999,v));
    var cur=sum(S.games)+S.offset;
    if(v!==cur){S.history.push({prevOffset:S.offset});S.offset+=v-cur;save();render();}
  }
  box.classList.remove('on');inp.blur();
}
document.getElementById('editok').onclick=applyEdit;
inp.onkeydown=function(e){if(e.key==='Enter')applyEdit();};
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
